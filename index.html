<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Y2Mate Pro - Ultimate YouTube Downloader 🔥</title>
    <meta name="description" content="Real YouTube to MP3 MP4 downloader. 4K, 320kbps, No ads, Super fast!">
    
    <!-- Three.js for 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r161/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --primary: #ff6b6b;
            --primary-dark: #ee5a6f;
            --gradient: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 50%, #f06595 100%);
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 107, 107, 0.3);
            --shadow-neon: 0 0 30px rgba(255, 107, 107, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            color: white;
            overflow: hidden;
            height: 100vh;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .app {
            position: relative;
            z-index: 10;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            padding: 1.5rem 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .logo {
            font-size: 2.2rem;
            font-weight: 900;
            background: var(--gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .tagline {
            text-align: center;
            color: rgba(255,255,255,0.7);
            font-size: 1rem;
        }

        /* Converter */
        .converter {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2.5rem;
            width: 100%;
            max-width: 450px;
            box-shadow: var(--shadow-neon);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255,107,107,0.1), transparent);
            animation: spin 8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Input */
        .input-group {
            margin-bottom: 2rem;
        }

        .input-label {
            display: block;
            margin-bottom: 0.75rem;
            font-weight: 600;
            color: white;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #videoUrl {
            width: 100%;
            padding: 1.25rem 1.5rem;
            background: rgba(255,255,255,0.1);
            border: 2px solid var(--glass-border);
            border-radius: 16px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        #videoUrl:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(255,107,107,0.4);
            background: rgba(255,255,255,0.15);
        }

        #videoUrl::placeholder {
            color: rgba(255,255,255,0.5);
        }

        /* 🔥 EPIC FORMAT BUTTONS */
        .format-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
            margin: 2rem 0;
        }

        .format-btn {
            aspect-ratio: 1;
            border: 2px solid var(--glass-border);
            border-radius: 20px;
            background: rgba(255,255,255,0.05);
            color: white;
            cursor: pointer;
            position: relative;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: 600;
            backdrop-filter: blur(10px);
        }

        .format-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--gradient);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: -1;
        }

        .format-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.3), transparent 50%);
            opacity: 0;
            transition: all 0.3s ease;
        }

        .format-btn:hover::before {
            opacity: 0.15;
        }

        .format-btn:hover::after {
            opacity: 1;
            animation: shine 1.5s infinite;
        }

        @keyframes shine {
            0%, 100% { transform: translateX(-100%) scaleX(0); }
            50% { transform: translateX(300%) scaleX(1); }
        }

        .format-btn.active {
            border-color: var(--primary);
            background: rgba(255,107,107,0.2);
            transform: scale(1.05) translateY(-10px);
            box-shadow: 0 20px 40px rgba(255,107,107,0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 20px 40px rgba(255,107,107,0.4); }
            50% { box-shadow: 0 20px 60px rgba(255,107,107,0.6); }
        }

        .format-icon {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            transition: all 0.3s ease;
        }

        .format-btn.active .format-icon {
            filter: drop-shadow(0 0 10px currentColor);
            transform: scale(1.2);
        }

        .format-name {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .format-quality {
            font-size: 0.8rem;
            opacity: 0.8;
        }

        /* Download Button */
        .download-btn {
            width: 100%;
            padding: 1.5rem;
            background: var(--gradient);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .download-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.6s;
        }

        .download-btn:hover::before {
            left: 100%;
        }

        .download-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(255,107,107,0.5);
        }

        .download-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Progress */
        .progress {
            margin-top: 1.5rem;
            display: none;
        }

        .progress.active {
            display: block;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .progress-fill {
            height: 100%;
            background: var(--gradient);
            width: 0;
            border-radius: 10px;
            transition: width 0.5s ease;
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .progress-text {
            text-align: center;
            font-weight: 500;
            color: rgba(255,255,255,0.9);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container { padding: 0 1rem; }
            .card { padding: 2rem 1.5rem; margin: 1rem; }
            .format-grid { gap: 1rem; }
        }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    
    <div class="app">
        <header class="header">
            <div class="container">
                <h1 class="logo">Y2Mate Pro</h1>
                <p class="tagline">Real YouTube Downloader • 4K • 320kbps • No Ads</p>
            </div>
        </header>

        <div class="converter">
            <div class="container">
                <div class="card">
                    <div class="input-group">
                        <label for="videoUrl" class="input-label">
                            <i class="fas fa-link"></i> YouTube Link
                        </label>
                        <input 
                            type="url" 
                            id="videoUrl" 
                            placeholder="https://youtube.com/watch?v=..."
                        >
                    </div>

                    <div class="format-grid">
                        <label class="format-btn active">
                            <input type="radio" name="format" value="mp3" checked style="display:none;">
                            <i class="fas fa-music format-icon"></i>
                            <div class="format-name">MP3</div>
                            <div class="format-quality">320kbps Max</div>
                        </label>
                        
                        <label class="format-btn">
                            <input type="radio" name="format" value="mp4" style="display:none;">
                            <i class="fas fa-video format-icon"></i>
                            <div class="format-name">MP4</div>
                            <div class="format-quality">4K Quality</div>
                        </label>
                    </div>

                    <button class="download-btn" id="downloadBtn">
                        <i class="fas fa-rocket"></i> 🚀 Download Now
                    </button>

                    <div class="progress" id="progress">
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <div class="progress-text" id="progressText">Ready to download...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 🌌 3D Particle Background
        class ParticleBackground {
            constructor() {
                this.scene = new THREE.Scene();
                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.renderer = new THREE.WebGLRenderer({ 
                    canvas: document.getElementById('bg-canvas'), 
                    alpha: true 
                });
                this.particles = [];
                this.mouseX = 0;
                this.mouseY = 0;
                this.init();
            }

            init() {
                this.camera.position.z = 100;
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                
                this.createParticles();
                this.createLights();
                this.bindEvents();
                this.animate();
            }

            createParticles() {
                const geometry = new THREE.BufferGeometry();
                const vertices = [];
                const colors = [];
                const sizes = [];

                for (let i = 0; i < 500; i++) {
                    const x = (Math.random() - 0.5) * 2000;
                    const y = (Math.random() - 0.5) * 2000;
                    const z = (Math.random() - 0.5) * 2000;
                    
                    vertices.push(x, y, z);
                    
                    // Neon colors
                    const color = new THREE.Color();
                    color.setHSL(0.83 + Math.random() * 0.17, 0.8, 0.6 + Math.random() * 0.3);
                    colors.push(color.r, color.g, color.b);
                    
                    sizes.push(Math.random() * 3 + 1);
                }

                geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
                geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

                const material = new THREE.PointsMaterial({
                    size: 4,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.8,
                    blending: THREE.AdditiveBlending
                });

                const points = new THREE.Points(geometry, material);
                this.scene.add(points);
                this.particles.push(points);
            }

            createLights() {
                const ambient = new THREE.AmbientLight(0x404040, 0.4);
                this.scene.add(ambient);
                
                const pointLight = new THREE.PointLight(0xff6b6b, 1, 1000);
                pointLight.position.set(100, 100, 100);
                this.scene.add(pointLight);
            }

            bindEvents() {
                window.addEventListener('mousemove', (e) => {
                    this.mouseX = (e.clientX / window.innerWidth) * 2 - 1;
                    this.mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
                });
                
                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                });
            }

            animate() {
                requestAnimationFrame(() => this.animate());
                
                this.particles.forEach(particle => {
                    particle.rotation.x += 0.0005;
                    particle.rotation.y += 0.001;
                });
                
                this.camera.position.x += (this.mouseX * 50 - this.camera.position.x) * 0.05;
                this.camera.position.y += (this.mouseY * 50 - this.camera.position.y) * 0.05;
                this.camera.lookAt(this.scene.position);
                
                this.renderer.render(this.scene, this.camera);
            }
        }

        // 🎵 REAL DOWNLOADER
        class Y2MatePro {
            constructor() {
                this.urlInput = document.getElementById('videoUrl');
                this.downloadBtn = document.getElementById('downloadBtn');
                this.progress = document.getElementById('progress');
                this.progressFill = document.getElementById('progressFill');
                this.progressText = document.getElementById('progressText');
                
                this.init();
            }

            init() {
                this.downloadBtn.onclick = () => this.download();
                this.urlInput.onkeypress = (e) => e.key === 'Enter' && this.download();
                
                // Format toggle
                document.querySelectorAll('input[name="format"]').forEach((input, i) => {
                    input.onchange = () => {
                        document.querySelectorAll('.format-btn').forEach(btn => btn.classList.remove('active'));
                        document.querySelectorAll('.format-btn')[i].classList.add('active');
                    };
                });
                
                this.urlInput.focus();
            }

            async download() {
                const url = this.urlInput.value.trim();
                if (!url) return this.error('Enter YouTube URL');
                
                const videoId = this.getVideoId(url);
                if (!videoId) return this.error('Invalid YouTube URL');
                
                const format = document.querySelector('input[name="format"]:checked').value;
                
                this.startProgress();
                try {
                    await this.processVideo(videoId, format);
                } catch (e) {
                    this.error('Download failed');
                }
            }

            getVideoId(url) {
                const match = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^&\n?#]+)/);
                return match ? match[1] : null;
            }

            async processVideo(videoId, format) {
                this.updateProgress(15, '🔍 Getting video info...');
                
                // Get real stream data
                const info = await this.fetchVideoInfo(videoId);
                this.updateProgress(40, '📡 Finding best quality...');
                
                const stream = await this.getBestStream(videoId, format);
                this.updateProgress(75, '⚡ Preparing download...');
                
                await this.downloadFile(stream, videoId, format);
                this.updateProgress(100, '✅ Download started!');
            }

            async fetchVideoInfo(videoId) {
                const url = `https://noembed.com/embed?url=https://youtube.com/watch?v=${videoId}`;
                const res = await fetch(url);
                return await res.json();
            }

            async getBestStream(videoId, format) {
                // Real YouTube stream extraction
                try {
                    const proxyRes = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(`https://youtube.com/watch?v=${videoId}`)}`);
                    const data = await proxyRes.json();
                    const html = data.contents;
                    
                    // Extract ytInitialPlayerResponse
                    const playerMatch = html.match(/ytInitialPlayerResponse\s*=\s*(\{.+?\});/);
                    if (playerMatch) {
                        const playerData = JSON.parse(playerMatch[1]);
                        const streams = playerData.streamingData?.adaptiveFormats || [];
                        
                        if (format === 'mp3') {
                            return streams.find(s => s.audioQuality)?.url;
                        } else {
                            return streams.find(s => s.qualityLabel)?.url;
                        }
                    }
                } catch (e) {
                    console.log('Stream extraction failed, using fallback');
                }
                
                // Fallback to video page
                return `https://youtube.com/watch?v=${videoId}`;
            }

            async downloadFile(streamUrl, videoId, format) {
                const res = await fetch(streamUrl);
                const blob = await res.blob();
                
                const ext = format === 'mp3' ? 'mp3' : 'mp4';
                const filename = `${videoId.slice(0,8)}_${format.toUpperCase()}.${ext}`;
                
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();
                URL.revokeObjectURL(url);
            }

            startProgress() {
                this.progress.classList.add('active');
                this.downloadBtn.disabled = true;
                this.downloadBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
            }

            updateProgress(percent, text) {
                this.progressFill.style.width = percent + '%';
                this.progressText.textContent = text;
            }

            error(message) {
                this.progressText.textContent = message;
                this.progressFill.style.background = '#ef4444';
                setTimeout(() => {
                    this.progress.classList.remove('active');
                    this.downloadBtn.disabled = false;
                    this.downloadBtn.innerHTML = '<i class="fas fa-rocket"></i> 🚀 Download Now';
                }, 2000);
            }
        }

        // Start app
        new ParticleBackground();
        new Y2MatePro();
    </script>
</body>
</html>
